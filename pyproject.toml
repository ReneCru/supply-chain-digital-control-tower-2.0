[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-digital-control-tower-portfolio"
version = "0.1.0"
description = "Recruiter-facing portfolio edition of a governed supply-chain decision-support platform"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
